name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Cache Buildozer local dir
        uses: actions/cache@v4
        with:
          path: mobile/.buildozer
          key: buildozer-local-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec', 'mobile/main.py') }}
          restore-keys: |
            buildozer-local-${{ runner.os }}-

      - name: Build APK
        working-directory: mobile
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: minishop-debug-apk-${{ github.run_number }}
          path: mobile/bin/*.apk
          retention-days: 30

      - name: Upload build log jika gagal
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-failed-${{ github.run_number }}
          path: mobile/build.log
          retention-days: 7
